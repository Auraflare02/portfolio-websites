name: Enable real Supabase auth

on:
  push:
    paths:
      - '.github/workflows/enable-real-auth.yml'

permissions:
  contents: write

jobs:
  patch-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Supabase authentication into the portfolio
        env:
          SUPABASE_URL: https://hfvxgfmefxqdicavxjkq.supabase.co
          SUPABASE_KEY: sb_publishable_uNsaL7O4l0ybny3dVyZFZw__rDkSWfS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'Demo mode: the account is stored only in this browser. It is not production authentication.',
              'Real account security is handled by Supabase. New accounts may need email confirmation before first sign-in.'
          )
          marker = '<button type="button" id="forgotPassword" class="btn" style="width:100%;margin-top:9px">Forgot password?</button>'
          if marker not in s:
              s = s.replace(
                  '<p class="status" id="authStatus"></p>',
                  marker + '<p class="status" id="authStatus"></p>',
                  1
              )
          if '@supabase/supabase-js@2.116.0' not in s:
              s = s.replace('<script>', '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script>', 1)
          start = s.find("let authMode='signin';")
          end = s.find('// package buttons', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate portfolio auth block')
          auth = r'''const SUPABASE_URL='https://hfvxgfmefxqdicavxjkq.supabase.co';const SUPABASE_PUBLISHABLE_KEY='sb_publishable_uNsaL7O4l0ybny3dVyZFZw__rDkSWfS';const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);let authMode='signin';const authModal=$('#authModal'),authTitle=$('#authTitle'),nameField=$('#nameField'),authStatus=$('#authStatus'),authSubmit=$('#authSubmit');function openAuth(mode='signin'){authMode=mode;authModal.classList.add('show');document.body.classList.add('lock');setAuthMode(mode);setTimeout(()=>$('#authEmail').focus(),60)}function closeModal(id){$('#'+id).classList.remove('show');document.body.classList.remove('lock')}function setAuthMode(mode){authMode=mode;authTitle.textContent=mode==='signin'?'Sign in':'Create your account';nameField.style.display=mode==='signup'?'flex':'none';authSubmit.textContent=mode==='signin'?'Sign in →':'Create account →';$$('.auth-tab').forEach(b=>b.classList.toggle('active',b.dataset.auth===mode));authStatus.textContent='';authStatus.className='status'}async function renderUser(){const {data:{user}}=await supabaseClient.auth.getUser();if(user){$('#userPill').classList.add('show');$('#userLabel').textContent=user.user_metadata?.name||user.email?.split('@')[0]||'Account';$('#authBtn').textContent='Sign out';$('#authBtn').onclick=async()=>{const {error}=await supabaseClient.auth.signOut();if(error)toast(error.message);else{await renderUser();toast('Signed out')}}}else{$('#userPill').classList.remove('show');$('#authBtn').textContent='Sign in';$('#authBtn').onclick=()=>openAuth()}}$('#authBtn').onclick=()=>openAuth();$$('[data-auth]').forEach(b=>b.onclick=()=>setAuthMode(b.dataset.auth));$$('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));authModal.onclick=e=>{if(e.target===authModal)closeModal('authModal')};$('#authForm').onsubmit=async e=>{e.preventDefault();authStatus.textContent='Working…';authStatus.className='status';const email=$('#authEmail').value.trim().toLowerCase(),password=$('#authPassword').value,name=$('#authName').value.trim();let data,error;if(authMode==='signup'){({data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{name}}}));if(!error){if(data.session){toast('Account created and signed in');closeModal('authModal')}else{authStatus.textContent='Account created. Check your email to confirm it, then sign in here.';authStatus.className='status success';return}}}else{({data,error}=await supabaseClient.auth.signInWithPassword({email,password}));if(!error){toast('Signed in');closeModal('authModal')}}if(error){authStatus.textContent=error.message;authStatus.className='status error'}else{await renderUser()}};$('#forgotPassword').onclick=async()=>{const email=$('#authEmail').value.trim().toLowerCase();if(!email){authStatus.textContent='Enter your email first.';authStatus.className='status error';return}authStatus.textContent='Sending reset email…';authStatus.className='status';const {error}=await supabaseClient.auth.resetPasswordForEmail(email);if(error){authStatus.textContent=error.message;authStatus.className='status error'}else{authStatus.textContent='Password reset email sent. Check your inbox.';authStatus.className='status success'}};supabaseClient.auth.onAuthStateChange(()=>renderUser());renderUser();'''
          s = s[:start] + auth + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
          node --check <(python3 -c "import re; s=open('index.html').read(); print(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)[-1])")
      - name: Commit auth patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Enable real Supabase signup and login [skip auth patch]'
          git push
