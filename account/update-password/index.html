<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Update your Auraflare02 account password."><title>Update password — Auraflare02</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% -10%,#18243b,#07090d 45%);color:#f4f6f2;font:15px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{width:min(470px,calc(100% - 30px));padding:25px;border:1px solid #ffffff18;border-radius:22px;background:#0d1118;box-shadow:0 40px 120px #0009}.ey{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#7f8999}.box h1{font-size:43px;line-height:.93;letter-spacing:-.07em;margin:9px 0 20px}.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}.field label{font-size:11px;color:#98a2b0}.field input{padding:12px;border:1px solid #ffffff18;background:#ffffff08;color:#f4f6f2;border-radius:10px;outline:0}.field input:focus{border-color:#8ea7ff66;box-shadow:0 0 0 4px #8ea7ff12}.btn{width:100%;margin-top:15px;padding:12px;border:0;border-radius:11px;background:#f4f6f2;color:#07090d;font-weight:850;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.status{min-height:20px;margin-top:10px;font-size:12px;color:#98a2b0}.success{color:#7be2b0}.error{color:#ff9a9a}.back{display:block;margin-top:14px;color:#98a2b0;font-size:12px;text-decoration:none}</style></head><body><main class="box"><div class="ey">Auraflare02 · Account</div><h1>Set a new password.</h1><form id="resetForm"><div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="6" autocomplete="new-password" required placeholder="6+ characters"></div><div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required placeholder="Repeat password"></div><button class="btn" id="submit" type="submit">Update password →</button><div id="status" class="status"></div></form><a class="back" href="../../">← Back to portfolio</a></main><script>const client=supabase.createClient('https://hfvxgfmefxqdicavxjkq.supabase.co','sb_publishable_uNsaL7O4l0ybny3dVyZFZw__rDkSWfS');const form=document.getElementById('resetForm'),status=document.getElementById('status'),submit=document.getElementById('submit');client.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){status.textContent='Choose a new password.';status.className='status success'}});(async()=>{const {data:{session}}=await client.auth.getSession();if(!session&&!location.hash.includes('access_token')){status.textContent='Open this page from the password-reset email.';status.className='status error'}})();form.onsubmit=async e=>{e.preventDefault();status.textContent='Updating…';status.className='status';submit.disabled=true;const a=document.getElementById('newPassword').value,b=document.getElementById('confirmPassword').value;if(a!==b){status.textContent='Passwords do not match.';status.className='status error';submit.disabled=false;return}const {error}=await client.auth.updateUser({password:a});if(error){status.textContent=error.message;status.className='status error';submit.disabled=false;return}status.textContent='Password updated successfully. You can return to the portfolio and sign in.';status.className='status success';setTimeout(()=>client.auth.signOut(),1500)};</script></body></html>
